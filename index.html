<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ai cavalli!</title>
<meta name="theme-color" content="#16140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ai cavalli!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=Rye&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ SCHERMATA PRINCIPALE ============ -->
<main class="app" id="screen-main">
  <header>
    <button type="button" class="round left" id="toImp" aria-label="Imprevisti registrati">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>Ai cavalli!</h1>
    <button type="button" class="round right" id="stop" aria-label="Ferma tutti i suoni">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2" fill="currentColor"/></svg>
    </button>
  </header>

  <section aria-labelledby="h-m">
    <h2 id="h-m">Musiche</h2>
    <div class="grid3" id="music"></div>
  </section>

  <div class="middle" id="middle">
    <div class="mid">
      <span class="rule" aria-hidden="true"></span>
      <button type="button" class="x x1 pad" data-i="0"></button>
      <button type="button" class="x x2 pad" data-i="1"></button>
      <button type="button" class="x x3 pad" data-i="2"></button>
      <button type="button" class="imp pad" id="imp" aria-label="Imprevisto">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v16 M21 4v16 M5.5 7.5h5v9h-5z M13.5 7.5h5v9h-5z M8 7.5c0-1.5 1-2.5 2.5-2.5 M16 7.5c0-1.5-1-2.5-2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="cav" id="cav">
        <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><path d="M9 6v11a8 8 0 0 0 16 0V6" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><circle cx="9" cy="11" r="1.1" fill="#F4EFE6"/><circle cx="25" cy="11" r="1.1" fill="#F4EFE6"/><circle cx="10" cy="18" r="1.1" fill="#F4EFE6"/><circle cx="24" cy="18" r="1.1" fill="#F4EFE6"/></svg>
        <span class="lab" id="cavLab">Inizia la storia</span>
      </button>
    </div>
    <div class="menu" id="menu" role="group" hidden></div>
  </div>

  <section aria-labelledby="h-a">
    <h2 id="h-a">Accenti</h2>
    <div class="grid3" id="acc"></div>
  </section>

  <div class="transport" id="transport" hidden>
    <button type="button" class="t main" id="pp"></button>
    <button type="button" class="t" id="restart">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7 M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Riavvia
    </button>
  </div>
</main>

<!-- ============ SCHERMATA IMPREVISTI ============ -->
<main class="app" id="screen-imp" hidden>
  <header>
    <button type="button" class="round left" id="back" aria-label="Torna al pannello">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="small">Imprevisti</h1>
    <span class="count" id="count">0/50</span>
  </header>

  <div class="recbox">
    <button type="button" class="recbtn" id="rec" aria-label="Registra un imprevisto">
      <span class="recdot" aria-hidden="true"></span>
    </button>
    <div class="rectext">
      <strong id="recState">Registra un imprevisto</strong>
      <span id="recHint">Tocca il pulsante, di' la frase, tocca di nuovo per fermare. Massimo 30 secondi.</span>
    </div>
  </div>
  <p class="msg" id="impMsg" role="status" aria-live="polite" hidden></p>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty">Nessun imprevisto registrato. Durante la storia, il tasto con le porte del saloon ne fa partire uno a caso.</p>
</main>

<div class="curtain" id="curtain" aria-hidden="true"><span>C'era una volta…</span></div>
<button type="button" class="scrim" id="scrim" aria-label="Chiudi la scelta" hidden></button>

<script type="module" src="js/app.js"></script>
</body>
</html>
